services:
  app:
    build: .
    ports: ["8081:8081"]
    environment:
      DOMAINFORGE_AVAILABILITY: rdap
      # Optional generative LLM via the local Ollama service below (start with: docker compose --profile llm up)
      # DOMAINFORGE_LLM_MODEL: qwen2.5:3b
      # DOMAINFORGE_LLM_URL: http://ollama:11434/v1

  ollama:
    image: ollama/ollama
    profiles: ["llm"]
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

volumes:
  ollama:
